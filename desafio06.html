<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        li{
            width: 80px;
            text-align: center;
            padding: 10px;
        }
    </style>
    <title>Desafio 6</title>
</head>

<body>
    <ul>
        <li>Item 1
        <li>Item 2
        <li>Item 3
        <li>Item 4
        <li>Item 5
    </ul>
    <button class="proximo">Próximo</button>


    <script>
        let atual = document.querySelector('li')
        let proximo = document.querySelector('.proximo')

        atual.style.backgroundColor = 'yellow'

        proximo.addEventListener('click', () => {
            atual.style.backgroundColor = 'white'

            atual = atual.nextElementSibling

            if (atual == null) {
                atual.document.querySelector('li')
            }

            atual.style.backgroundColor = 'yellow'

        })
    </script>
</body>

</html>
